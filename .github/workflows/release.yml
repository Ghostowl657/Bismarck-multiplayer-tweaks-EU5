
name: Release Mod

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package mod files
        run: |
          zip -r Bismarck-Multiplayer-Tweaks.zip \
            .metadata \
            in_game \
            loading_screen \
            main_menu

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release exists. Uploading ZIP..."
            gh release upload "$TAG" \
              Bismarck-Multiplayer-Tweaks.zip \
              --clobber
          else
            echo "Creating new release..."
            gh release create "$TAG" \
              Bismarck-Multiplayer-Tweaks.zip \
              --generate-notes
          fi
